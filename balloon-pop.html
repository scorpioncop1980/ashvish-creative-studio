<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Balloon Pop | Ashvish Creative Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#6EC1F0;
  font-family:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
.hidden{display:none !important}
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:flex-start;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none}
#stats{display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
#ctrls{display:flex;gap:8px;pointer-events:auto}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 14px;font-weight:800;
  font-size:clamp(15px,3.8vw,20px);color:#5A3E5C;box-shadow:0 3px 0 rgba(0,0,0,.08);white-space:nowrap}
.pill b{color:#FF7A8A;font-size:1.15em}
.pill.low b{color:#E0475B}
.icon{width:46px;height:46px;border-radius:50%;border:none;background:#FFDAC1;color:#5A3E5C;
  font-size:20px;font-weight:800;box-shadow:0 4px 0 #E3B293;cursor:pointer}
.icon:active{transform:translateY(2px);box-shadow:0 2px 0 #E3B293}
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(110,193,240,.28)}
.card{background:rgba(255,255,255,.94);border-radius:28px;padding:22px 20px;width:min(92vw,430px);
  text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.07);max-height:96vh;overflow:auto}
.title{font-family:'Dancing Script',cursive,'Baloo 2','Trebuchet MS',sans-serif;font-weight:700;
  font-size:clamp(46px,11vw,70px);line-height:1.05;color:#FF7A8A;text-shadow:0 3px 0 #FFDAC1;margin-bottom:4px}
.sub{color:#5A3E5C;font-size:18px;margin-bottom:12px}
.chips{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.chip{border:none;border-radius:999px;padding:9px 14px;font-size:16px;font-weight:800;
  background:#F7F3C7;color:#5A3E5C;cursor:pointer;box-shadow:0 3px 0 #DCD69A}
.chip.on{background:#C7CEFF;box-shadow:0 3px 0 #9AA3E0}
.note{color:#7A5C7E;font-size:15px;margin-bottom:10px}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.set{border:4px solid transparent;border-radius:20px;padding:10px 6px;background:#FFDAC1;cursor:pointer;
  color:#5A3E5C;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.set.sel{border-color:#C7CEFF;transform:scale(1.03)}
.set.locked{background:#E4E4E4;color:#9A9A9A;cursor:not-allowed}
.set b{display:block;font-size:17px;margin:6px 0 2px}
.set small{font-size:13px;font-weight:700}
.sw{display:flex;justify-content:center;gap:4px}
.sw i{width:16px;height:16px;border-radius:50%;display:block}
.set.locked .sw{filter:grayscale(1);opacity:.6}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stats>div{flex:1;background:#B5EAD7;border-radius:18px;padding:8px 4px;color:#3D6B5C}
.stats span{display:block;font-size:14px;font-weight:800}
.stats b{display:block;font-size:30px;line-height:1.1}
.stats small{font-size:13px}
.big{display:block;width:100%;border:none;border-radius:999px;padding:15px;margin:10px 0 0;
  font-family:inherit;font-size:24px;font-weight:800;color:#6B3B4A;background:#FF9AA2;
  box-shadow:0 6px 0 #E07A85;cursor:pointer}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #E07A85}
.big.alt{background:#B5EAD7;color:#2F5E4E;box-shadow:0 6px 0 #86C7B0}
.big.alt:active{box-shadow:0 3px 0 #86C7B0}
.final{font-size:22px;color:#5A3E5C;margin:6px 0}
.final b{font-size:44px;color:#FF7A8A;display:block;line-height:1.1}
.record{color:#E0A21B;font-weight:800;font-size:20px;margin-top:4px}
.msg{min-height:24px;color:#3D6B5C;font-weight:800;font-size:17px;margin-top:8px}
#msg{position:fixed;left:50%;top:28%;transform:translateX(-50%);z-index:30;pointer-events:none;
  font-size:clamp(28px,8vw,46px);font-weight:800;color:#FF7A8A;text-shadow:0 3px 0 #fff;white-space:nowrap;opacity:0}
#msg.go{animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}
  70%{opacity:1;transform:translate(-50%,-10px) scale(1)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="stats" class="hidden">
    <div class="pill">Score <b id="score">0</b></div>
    <div class="pill" id="timePill">Time <b id="time">60</b></div>
    <div class="pill">Streak <b id="streak">0/5</b></div>
  </div>
  <div id="ctrls">
    <button class="icon" id="soundBtn" aria-label="Sound on or off">🔊</button>
    <button class="icon hidden" id="pauseBtn" aria-label="Pause">❚❚</button>
  </div>
</div>

<div id="msg"></div>

<div class="screen" id="start">
  <div class="card">
    <h1 class="title">Balloon Pop</h1>
    <p class="sub">Tap the balloons before they float away!</p>
    <div class="chips">
      <button class="chip on" data-mode="daily">Today's Challenge</button>
      <button class="chip" data-mode="free">Free Play</button>
    </div>
    <p class="note" id="modeNote"></p>
    <div class="sets" id="sets"></div>
    <div class="stats">
      <div><span>Daily Best</span><b id="dBest">0</b><small id="dDate"></small></div>
      <div><span>All-Time Best</span><b id="aBest">0</b><small>&nbsp;</small></div>
    </div>
    <button class="big" id="playBtn">Play!</button>
  </div>
</div>

<div class="screen hidden" id="pause">
  <div class="card">
    <h2 class="title">Paused</h2>
    <button class="big" id="resumeBtn">Resume</button>
    <button class="big alt" id="quitBtn">Quit to Menu</button>
  </div>
</div>

<div class="screen hidden" id="end">
  <div class="card">
    <h2 class="title">Time's Up!</h2>
    <p class="sub" id="fMode"></p>
    <div class="final">Final score <b id="fScore">0</b></div>
    <div class="final">Best score <b id="fBest" style="font-size:30px">0</b></div>
    <div class="record hidden" id="newRec">🎉 New personal best!</div>
    <button class="big" id="shareBtn">Share My Score</button>
    <div class="msg" id="shareMsg"></div>
    <button class="big alt" id="againBtn">Play Again</button>
  </div>
</div>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const cvs = $('c'), ctx = cvs.getContext('2d');
const CANVAS_FONT = "'Trebuchet MS','Segoe UI',system-ui,sans-serif";
const ROUND = 60;

let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = W * DPR; cvs.height = H * DPR;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- storage ---------- */
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getDaily(){
  const d = store.get('balloonpop.daily');
  return (d && d.date === todayKey()) ? (d.score || 0) : 0;   // resets every day
}
function getAllTime(){
  const v = store.get('balloonpop.best');
  return typeof v === 'number' ? v : 0;
}

/* ---------- seeded random ---------- */
function hashStr(s){
  let h = 2166136261;
  for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- balloon sets ---------- */
const SETS = [
  { name:'Candy Balloons',   need:0,    cols:['#FF9AA2','#FFDAC1','#F7F3C7','#B5EAD7','#C7CEFF'] },
  { name:'Pink Balloons',    need:500,  cols:['#FF9AA2','#FF8FC7','#FFB6D9','#FF7EB6','#FFC2E2'] },
  { name:'Golden Balloons',  need:1500, cols:['#FFE7A0','#FFDAA8','#F9F0B0','#FFD08A','#FBE7B5'] },
  { name:'Rainbow Balloons', need:3000, cols:['#FF9AA2','#FFDAC1','#F7F3C7','#B5EAD7','#C7CEFF','#E7B9FF','#FFB0E0'] }
];
let sel = 0;
let mode = 'daily';
let muted = false;

/* ---------- audio (Web Audio only) ---------- */
let AC = null;
function ac(){
  if (!AC){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function note(freq, t0, dur, type='sine', vol=0.2, endFreq=0){
  const a = ac();
  if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  const t = a.currentTime + t0;
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function popSound(){ note(520, 0, 0.16, 'sine', 0.35, 1100); note(1500, 0.03, 0.07, 'triangle', 0.1); }
function chime(){ [988, 1319, 1568, 2093].forEach((f,i) => note(f, i*0.07, 0.4, 'sine', 0.25)); }
function jingle(){ [523, 659, 784, 659, 784, 1047, 1319].forEach((f,i) => note(f, i*0.13, 0.26, 'triangle', 0.25)); }

function setMute(m){ muted = m; $('soundBtn').textContent = muted ? '🔇' : '🔊'; }
$('soundBtn').addEventListener('click', () => setMute(!muted));

/* ---------- schedule (seeded spawn pattern) ---------- */
function buildSchedule(rng){
  const ev = [];
  let t = 0.5;
  while (t < ROUND){
    const p = t / ROUND;
    const n = (p > 0.45 && rng() < 0.35) ? 2 : 1;          // busier later
    for (let i = 0; i < n; i++){
      ev.push({ t: t + i*0.15, x: rng(), gold: rng() < 0.08, sp: 0.85 + rng()*0.3, sw: rng()*6.28, c: rng() });
    }
    const gap = (0.75 - 0.45*p) * (0.6 + rng()*0.5);           // ~0.6s gaps early, ~0.25s late
    t += gap;
  }
  return ev;
}

/* ---------- game state ---------- */
let state = 'menu';      // menu | playing | paused | ended
let G = null;
let T = 0;
const clouds = Array.from({length:7}, () => ({
  x: Math.random(), y: 0.05 + Math.random()*0.6, s: 0.6 + Math.random()*0.8, v: 0.004 + Math.random()*0.008
}));
let amb = [];

function rad(){ return Math.round(Math.max(26, Math.min(58, Math.min(W*0.1, H*0.065)))); }

function spawnBalloon(ev, p){
  const r = rad();
  const pal = SETS[sel].cols;
  const bx = r + ev.x * (W - 2*r);
  return {
    bx, sx: bx, sw: ev.sw, r, y: H + r*1.4,
    v: H * (0.18 + 0.16*p) * ev.sp * (ev.t < 10 ? 0.95 : 1),
    gold: ev.gold,
    col: pal[Math.floor(ev.c * pal.length) % pal.length]
  };
}
function makeAmb(){
  const r = rad();
  const cols = SETS[0].cols;
  return { bx: Math.random()*W, sx:0, sw: Math.random()*6.28, r, y: H + r + Math.random()*H*0.3,
           v: H*(0.05 + Math.random()*0.05), gold:false, col: cols[Math.floor(Math.random()*cols.length)] };
}

function beginRound(){
  ac();
  const seed = mode === 'daily' ? hashStr(todayKey()) : (Math.random()*4294967296) >>> 0;
  const rng = mulberry32(seed);
  G = { elapsed:0, score:0, streak:0, balloons:[], parts:[], events:buildSchedule(rng), ei:0, final:0, record:false };
  state = 'playing';
  setScreens('game');
  hudUpdate();
}

function endRound(){
  state = 'ended';
  G.elapsed = ROUND;
  G.balloons = [];
  const s = G.score, prev = getAllTime();
  G.final = s;
  G.record = s > 0 && s > prev;
  if (s > prev) store.set('balloonpop.best', s);
  if (mode === 'daily' && s > getDaily()) store.set('balloonpop.daily', { date: todayKey(), score: s });
  jingle();
  hudUpdate();
  setTimeout(showEnd, 700);
}

function update(dt){
  G.elapsed += dt;
  const p = Math.min(G.elapsed / ROUND, 1);
  while (G.ei < G.events.length && G.events[G.ei].t <= G.elapsed){
    G.balloons.push(spawnBalloon(G.events[G.ei++], p));
  }
  stepBalloons(G.balloons, dt, true);
  if (G.elapsed >= ROUND) endRound();
  else hudUpdate();
}

function stepBalloons(list, dt, isGame){
  for (let i = list.length - 1; i >= 0; i--){
    const b = list[i];
    b.y -= b.v * dt;
    b.sx = b.bx + Math.sin(T*1.6 + b.sw) * Math.min(14, W*0.04);
    if (b.y + b.r*1.4 < 0){             // escaped: streak resets, no other penalty
      list.splice(i, 1);
      if (isGame && G) G.streak = 0;
    }
  }
}

function ambientStep(dt){
  stepBalloons(amb, dt, false);
  if (amb.length < 6 && Math.random() < dt*0.8) amb.push(makeAmb());
}

function popBalloon(i){
  const b = G.balloons.splice(i, 1)[0];
  const pts = b.gold ? 50 : 10;
  G.score += pts;
  G.streak++;
  const cols = b.gold ? ['#FFD94A','#FFF8D0','#FFFFFF','#F2B134']
                      : [b.col, '#FFFFFF', '#FFDAC1', '#F7F3C7', '#B5EAD7', '#C7CEFF'];
  burst(b.sx, b.y, cols);
  if (b.gold) chime(); else popSound();
  textPart(b.sx, b.y - b.r*1.4, '+' + pts, b.gold ? '#E0A21B' : '#FF7A8A');
  if (G.streak >= 5){
    G.score += 25;
    G.streak = 0;
    showMsg('Streak bonus +25!');
  }
  hudUpdate();
}

function burst(x, y, cols){
  for (let i = 0; i < 22; i++){
    const a = Math.random()*Math.PI*2, s = 120 + Math.random()*260;
    G.parts.push({ t:'c', x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 120,
      life:0.9 + Math.random()*0.4, max:1.2, c:cols[i % cols.length],
      rot:Math.random()*6, vr:(Math.random()-0.5)*12, w:6+Math.random()*5, h:4+Math.random()*4 });
  }
}
function textPart(x, y, txt, col){
  G.parts.push({ t:'t', x, y, vx:0, vy:-80, life:0.9, max:0.9, txt, c:col });
}
function stepParts(dt){
  if (!G) return;
  const P = G.parts;
  for (let i = P.length - 1; i >= 0; i--){
    const p = P[i];
    p.life -= dt;
    if (p.life <= 0){ P.splice(i, 1); continue; }
    if (p.t === 'c'){
      p.vy += 700*dt; p.vx *= 0.98; p.rot += p.vr*dt;
    }
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}

/* ---------- drawing ---------- */
function shade(hex){
  const n = parseInt(hex.slice(1), 16);
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255, f = 0.82;
  return `rgb(${(r*f)|0},${(g*f)|0},${(b*f)|0})`;
}
function drawBalloon(b){
  const x = b.sx, y = b.y, r = b.r, ry = r*1.18;
  const ink = '#5A3E5C';
  // string
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y+ry+r*0.2);
  ctx.quadraticCurveTo(x+r*0.25, y+ry+r*0.9, x-r*0.1, y+ry+r*1.8);
  ctx.stroke();
  // body
  const g = ctx.createRadialGradient(x-r*0.35, y-ry*0.45, r*0.08, x, y, ry*1.05);
  if (b.gold){ g.addColorStop(0,'#FFFBE0'); g.addColorStop(0.35,'#FFD84D'); g.addColorStop(1,'#D99A16'); }
  else { g.addColorStop(0,'#FFFFFF'); g.addColorStop(0.3,b.col); g.addColorStop(1,shade(b.col)); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x, y, r, ry, 0, 0, Math.PI*2); ctx.fill();
  // knot
  ctx.fillStyle = b.gold ? '#D99A16' : shade(b.col);
  ctx.beginPath();
  ctx.moveTo(x, y+ry-1); ctx.lineTo(x-r*0.13, y+ry+r*0.15); ctx.lineTo(x+r*0.13, y+ry+r*0.15);
  ctx.closePath(); ctx.fill();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.beginPath(); ctx.ellipse(x-r*0.42, y-ry*0.42, r*0.13, r*0.22, -0.5, 0, Math.PI*2); ctx.fill();
  // face
  ctx.fillStyle = ink;
  [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(x+s*r*0.32, y-ry*0.12, Math.max(1.8, r*0.085), 0, Math.PI*2); ctx.fill(); });
  ctx.fillStyle = 'rgba(255,122,138,.35)';
  [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(x+s*r*0.55, y+ry*0.22, r*0.14, 0, Math.PI*2); ctx.fill(); });
  ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1.5, r*0.07); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y+ry*0.12, r*0.3, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  if (b.gold){
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(x+r*0.55, y-ry*0.55, r*0.07, 0, Math.PI*2); ctx.fill();
  }
}
function drawList(list){ for (const b of list) drawBalloon(b); }

function drawCloud(x, y, s){
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  [[0,0,1],[0.9,-0.35,0.8],[1.8,0,0.95],[0.9,0.3,0.75]].forEach(([dx,dy,k]) => {
    ctx.beginPath(); ctx.arc(x+dx*s, y+dy*s, s*k, 0, Math.PI*2); ctx.fill();
  });
}
function drawBG(dt){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#6EC1F0'); g.addColorStop(1, '#BFE9FB');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const c of clouds){
    c.x += c.v*dt; if (c.x > 1.2) c.x = -0.25;
    drawCloud(c.x*W, c.y*H, c.s*Math.min(W,H)*0.09);
  }
}
function drawParts(){
  if (!G) return;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of G.parts){
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    if (p.t === 'c'){
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
    } else {
      ctx.font = `800 22px ${CANVAS_FONT}`;
      ctx.lineWidth = 5; ctx.strokeStyle = '#FFFFFF';
      ctx.strokeText(p.txt, p.x, p.y);
      ctx.fillStyle = p.c; ctx.fillText(p.txt, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
}

let last = performance.now();
function frame(now){
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now; T += dt;
  if (state === 'playing') update(dt);
  else if (state === 'menu' || state === 'ended') ambientStep(dt);
  if (state !== 'paused') stepParts(dt);
  drawBG(dt);
  if (state === 'menu' || state === 'ended') drawList(amb);
  if (G){ drawList(G.balloons); drawParts(); }
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
cvs.addEventListener('pointerdown', e => {
  if (state !== 'playing' || !G) return;
  ac();
  const x = e.clientX, y = e.clientY;
  for (let i = G.balloons.length - 1; i >= 0; i--){
    const b = G.balloons[i];
    const dx = (x - b.sx) / (b.r*1.15), dy = (y - b.y) / (b.r*1.3);
    if (dx*dx + dy*dy <= 1){ popBalloon(i); break; }
  }
});

function showMsg(txt){
  const m = $('msg');
  m.textContent = txt;
  m.classList.remove('go'); void m.offsetWidth; m.classList.add('go');
}

/* ---------- HUD & screens ---------- */
function hudUpdate(){
  if (!G) return;
  const left = Math.max(0, Math.ceil(ROUND - G.elapsed));
  $('score').textContent = G.score;
  $('time').textContent = left;
  $('streak').textContent = G.streak + '/5';
  $('timePill').classList.toggle('low', left <= 10);
}
function setScreens(v){
  $('start').classList.toggle('hidden', v !== 'menu');
  $('end').classList.toggle('hidden', v !== 'end');
  $('pause').classList.toggle('hidden', v !== 'pause');
  $('stats').classList.toggle('hidden', !(v === 'game' || v === 'pause'));
  $('pauseBtn').classList.toggle('hidden', !(v === 'game' || v === 'pause'));
}
function togglePause(){
  if (state === 'playing'){ state = 'paused'; setScreens('pause'); }
  else if (state === 'paused'){ state = 'playing'; setScreens('game'); }
}
function toMenu(){
  state = 'menu'; G = null;
  setScreens('menu'); renderMenu();
}
function showEnd(){
  setScreens('end');
  $('fMode').textContent = mode === 'daily' ? "Today's challenge" : 'Free play';
  $('fScore').textContent = G.final;
  $('fBest').textContent = getAllTime();
  $('newRec').classList.toggle('hidden', !G.record);
  $('shareMsg').textContent = '';
}

function renderSets(){
  const best = getAllTime();
  const box = $('sets');
  box.innerHTML = '';
  SETS.forEach((s, i) => {
    const locked = best < s.need;
    const b = document.createElement('button');
    b.className = 'set' + (i === sel ? ' sel' : '') + (locked ? ' locked' : '');
    b.disabled = locked;
    b.innerHTML =
      `<span class="sw">${s.cols.slice(0,3).map(c => `<i style="background:${c}"></i>`).join('')}</span>` +
      `<b>${s.name}</b><small>${locked ? '🔒 Reach ' + s.need : 'Unlocked'}</small>`;
    b.addEventListener('click', () => { sel = i; renderSets(); });
    box.appendChild(b);
  });
}
function renderMenu(){
  renderSets();
  $('dBest').textContent = getDaily();
  $('aBest').textContent = getAllTime();
  $('dDate').textContent = new Date().toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' });
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.mode === mode));
  $('modeNote').textContent = mode === 'daily' ? 'Same balloons for everyone today!' : 'Random balloons every round.';
}

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  mode = c.dataset.mode; renderMenu();
}));
$('playBtn').addEventListener('click', beginRound);
$('againBtn').addEventListener('click', beginRound);
$('pauseBtn').addEventListener('click', togglePause);
$('resumeBtn').addEventListener('click', togglePause);
$('quitBtn').addEventListener('click', toMenu);

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove();
    return ok;
  }
}
$('shareBtn').addEventListener('click', async () => {
  const text = `I scored ${G.final} points in Balloon Pop on Ashvish Creative Studio! Can you beat me? Play free: https://ashvishcreativestudio.com`;
  if (navigator.share){
    try { await navigator.share({ text }); return; }
    catch(e){ if (e && e.name === 'AbortError') return; }
  }
  const ok = await copyText(text);
  $('shareMsg').textContent = ok ? 'Copied! Share it anywhere.' : 'Could not copy. Please copy: ' + text;
});

window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') setMute(!muted);
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && (state === 'playing' || state === 'paused')) togglePause();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') togglePause(); });

/* ---------- boot ---------- */
for (let i = 0; i < 5; i++){ const a = makeAmb(); a.y = Math.random()*H; amb.push(a); }
renderMenu();
setScreens('menu');
requestAnimationFrame(frame);
})();
